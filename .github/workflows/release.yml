name: Release

# A release is a `v*` tag on main plus a GitHub release; the apps depend on
# the tag through git. The crate is never published to crates.io
# (`publish = false` in Cargo.toml). The GitHub release carries the notes
# from CHANGELOG.md and a source archive with its checksum and a provenance
# attestation.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != Cargo.toml version ${version}"; exit 1
          fi
      - name: Tag commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: CHANGELOG has a section for this version
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > /dev/null

  checks:
    name: Checks
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The tag as the apps fetch it: from GitHub, through git.
      - name: Consumer build from the pushed tag
        run: scripts/consumer-smoke.sh "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
      - name: Source archive and checksum
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="pass-store-${GITHUB_REF_NAME#v}/" \
            -o "dist/pass-store-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_SHA"
          cd dist && sha256sum pass-store-*.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/pass-store-*.tar.gz
      - name: Release notes from CHANGELOG
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
